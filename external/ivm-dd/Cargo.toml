[package]
name = "ivm-dd"
version = "0.1.0"
edition = "2021"
publish = false
description = """
Differential-dataflow incremental view maintenance configuration for the
TGMS external-baseline comparison. Consumes one exported storm-v2 cell,
maintains one dataflow per registered artifact family (13 families;
`iterate` for temporal_reachability), applies each burst's corrections as
retraction + re-insertion at valid time, and measures per-burst refresh
wall time and output digests for the oracle checker.
"""

# Deliberately its own workspace root: this crate must never be
# pulled into the repo's top-level `[workspace]`
# (crates/tgms-engine-core, crates/tgms-engine-py) -- an empty workspace
# table here is what stops `cargo` from trying.
[workspace]

[[bin]]
name = "ivm-dd"
path = "src/main.rs"

[dependencies]
timely = "=0.31.0"
differential-dataflow = "=0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# none yet; unit tests use only the crate's own fixtures + std/serde_json.

[profile.release]
opt-level = 3
