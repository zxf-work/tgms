# ladder-v1 campaign — FROZEN 2026-09-14 by lane D4b (OSDI'27 overhead-ladder
# measurement, coordinated under lane D4). Pre-registered before any run.
# Append-only from here: changes land as dated addenda below, never as edits
# to the blocks already frozen. No run has been submitted against this file
# (this lane is laptop-only per the campaign's "experiments remote only"
# rule — no ssh, no cluster access); the coordinator schedules and stamps
# the run of record.
freeze_id: ladder-v1-2026-09-14
anchor:
  worktree_commit: 1ae3a93665a2   # this lane's own HEAD at freeze time; NOT commit_under_test (see below)
  harness: [scripts/bench_overhead_ladder.py, scripts/overhead_ladder.slurm,
            docs/eval/overhead_ladder.md, tests/test_overhead_ladder.py]
  plans_dir: benchmarks/ladder-v1/plans
host: iTiger, bigTiger partition, one node, exec (scripts/overhead_ladder.slurm
      execs the interpreter as the job step's last command; see that script's
      own header for why)

store: bitcoinotc   # stores/bitcoinotc: 5,881 entities, 35,592 TRUST edge
                    # versions, vt in [1289241911728360, 1453684323757281]
                    # (epoch microseconds) — the same store
                    # e14-p1-leaf-overhead-bitcoinotc.json was measured
                    # against; every plan below was written against this
                    # store's known extent and node-id convention ("n<raw
                    # SNAP id>", from tgms/data/loaders.py::snap_edge_stream).

grid:
  reps: 5
  seeds: [0, 1, 2]
  rungs: [1, 2, 3, 4, 5]
  tokenizer: auto

