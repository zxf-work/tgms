name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # spec §7.5: make ci must finish < 15 min
    strategy:
      fail-fast: false
      matrix:
        # P0.6: the single-version job masked interpreter-specific breakage;
        # ubuntu-only (publish.yml already covers macOS wheel builds).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # commit-hygiene check (§8.1) walks history
      # native engine (D-028): the package is a mixed Rust/Python build, so
      # a source install needs a toolchain. Cached, or this dominates CI.
      # @stable floated and already bit once (clippy 1.98's chunks-exact
      # lint broke `-D warnings` mid-cycle, 8ffe464/41e498f). Pinned here
      # via @master + explicit `toolchain` (P0.6) — @master does NOT read
      # rust-toolchain.toml on its own (confirmed against the action's
      # README: with no @rev-implied channel, `toolchain` must be given
      # explicitly), so the version below must be kept equal to the
      # `channel` in rust-toolchain.toml; the file still governs local
      # `cargo` builds run without this action.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # v7, not v5: publish.yml already pins v7, and two workflows on
      # different majors of the same action is how one of them goes stale
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra agent
      - name: rust core tests
        run: cargo test -p tgms-engine-core
      - name: rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: lint
        run: uv run ruff check tgms/ tests/ scripts/
      - name: commit hygiene (spec §8.1)
        run: uv run python scripts/check_commit_hygiene.py
      - name: site facts (docs/BLOG_STYLE.md §8)
        run: uv run python scripts/site_facts.py check
      - name: blog structure (docs/BLOG_STYLE.md §3)
        run: uv run python scripts/check_blog_structure.py
      # M2/M3 receipt gates (M3 plan §9.14): `make ci` runs these locally, and
      # a frozen receipt can regress while the suites stay green, so the
      # workflow must run them too. digest-stability covers both backends
      # (native + duckdb; duckdb comes with the dev group uv sync installs).
      - name: digest stability (M2 §8.4)
        run: uv run python scripts/check_digest_stability.py
      - name: ttq semantics (M2.1 gate)
        run: uv run python scripts/check_ttq_semantics.py
      - name: tgir leaf totality (M2.2 gate)
        run: uv run python scripts/check_tgir_leaf_totality.py
      - name: scope shape (M2.3 gate)
        run: uv run python scripts/check_scope_shape.py
      # M5 §0.2-4 / §7.1: this gate was a `make ci` target but absent from
      # CI, so a contributor could break the freshness import boundary
      # invisibly. M5 leans on it (P1.2-e).
      - name: freshness import boundary (M5 §7.1)
        run: uv run python scripts/check_freshness_boundary.py
      - name: tests (fast property profile)
        run: TGMS_HYP_EXAMPLES=25 uv run pytest tests/ -q
