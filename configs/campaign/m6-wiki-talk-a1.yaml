# M6 Study A: nested algebra level a1 (5 of 15 ops), causal
# frontier experiment (D-107). Same runtime/model/seed/repair budget at
# every level; only the surface differs — and the excluded ops vanish from
# the planner manual, not just the router.
suite_path: stores/suite-wiki-talk/suite-v3.json
store_path: stores/wiki-talk
out_dir: runs/m6-wiki-talk-a1
split: dev
systems: [ours]
models: ["openai/Qwen/Qwen2.5-14B-Instruct-AWQ"]
seeds: [0]
max_repairs: 3
exclude_ops: ['temporal_reachability', 'temporal_paths', 'co_active', 'count_temporal_motifs', 'find_temporal_motif_instances', 'burst_detection', 'neighborhood_evolution', 'diff_snapshots', 'aggregate_events', 'version_history']
memory_db: stores/wiki-talk/memory.sqlite
llm_api_base: "http://localhost:8000/v1"
llm_api_key: "EMPTY"
