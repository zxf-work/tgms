# ldbc-ref-v1 campaign — FROZEN 2026-09-14 by lane D1-prep (OSDI'27 Claim C9,
# LDBC generality's reference-correctness gap). Pre-registered before any run.
# Append-only from here: changes land as dated addenda below, never as edits
# to the blocks already frozen. This lane is laptop-only, prep-only — no
# experiment, ssh session, download, or Neo4j instance was run to produce
# this file; every prediction below is derived from the D1-local SF1
# campaign record and the design memo, cited per row, never invented.
#
# Companion: benchmarks/ldbc-ref-v1/RUNBOOK.md (the how). This file is the
# what-was-predicted; the coordinator/xzgpu lane stamps the run of record.
freeze_id: ldbc-ref-v1-2026-09-14
anchor:
  worktree_commit: 85ae2cd   # this lane's own HEAD at freeze time (main >= 85ae2cd)
  design: docs/design/LDBC_REFERENCE_CORRECTNESS_DESIGN_2026-09-13.md   # D1
  correction: docs/design/BI6_TRIAGE_2026-09-14.md                     # D2 — BI6 is a plan defect, not a TGIR-SEMANTIC-GAP
  harness: [scripts/ldbc_snb_params.py, scripts/tgir_ldbc_sf1.py,
            scripts/ldbc_reference_run.py, scripts/ldbc_compare.py]
  runbook: benchmarks/ldbc-ref-v1/RUNBOOK.md

host: xzgpu (40 cores, 93 GB; per docs/eval/REPRODUCE.md — nothing else
      scheduled in the run's window per the coordinator's brief)

substrate:
  dataset: ldbc-sf1 BI initial snapshot, composite-merged-fk (TGMS side) /
           composite-projected-fk (Neo4j side) — same generated SF1 data,
           two serializations, proven equal by the mandatory same-data gate
           (RUNBOOK.md §4.2) before any query runs
  gate_bound_counts: "2,997,352 nodes / 17,196,776 edges"   # design memo §2, citing PAPER_A_EVIDENCE_FREEZE.md §E addendum 2
  no_update_streams: true   # M8 — only initial_snapshot/ is ever read (RUNBOOK.md §4.3)

neo4j:
  version: 5.26.0   # Community; RUNBOOK.md §2.1 for the two-vendor version conflict this resolves
  dialect_citation: "external_workloads/ldbc/bi/neo4j/scripts/vars.sh:9 (NEO4J_VERSION default 5.20.0); scripts/import.sh:67 (neo4j-admin database import full, a 5.x-only subcommand)"
  plugins: [apoc-5.26.0-core]   # bi-10.cypher is the only one of the 24 queries calling into APOC (apoc.path.subgraphNodes)
  config: {heap: 8g, pagecache: 16g, transaction_timeout_s: 600}   # RUNBOOK.md §2.3, reusing the figure the design memo already judged adequate at this scale

parameters:
  source: benchmarks/ldbc-ref-v1/params.json   # scripts/ldbc_snb_params.py::export_bindings(), one binding, two consumers (design memo §3)
  seed: 5724984519806421702                    # CAMPAIGN_SEED, == the D1-local SF1 campaign's seed (benchmarks/results-v1/ldbc-sf1-campaign.json manifest.campaign_seed)
  selection_rule: "first tuple in LDBC's own file order (design memo §3, §A9)"

tie_break_policy: docs/design/LDBC_REFERENCE_CORRECTNESS_DESIGN_2026-09-13.md#4   # scripts/ldbc_compare.py::compare_topk implements it; RUNBOOK.md §8 on why sort_keys must be supplied by hand

