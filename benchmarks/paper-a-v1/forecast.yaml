# Paper A evidence campaign — machine-readable forecast (paper-a-v1)
#
# NORMATIVE for the per-row predictions. docs/design/PAPER_A_EVIDENCE_FREEZE.md
# is normative for the protocol, the mapping rules, the denominators and the
# discipline. APPEND-ONLY after commit: a changed prediction requires a dated
# addendum in the freeze, never an edit here.
#
# Reproduce the derived_admission block (machine-independent, no store needed):
#   for each plan in benchmarks/tgir-v1/plans/*.json with suite ldbc-* and
#   predicted_v1_support in {yes, partial-columns}: substitute the artifact's own
#   `params` block into itself, tgms.tgir.loader.load(), then
#   tgms.tgir.admission.plan_estimate(plan, sf1_stats) with sf1_stats below.
#   Compare each axis against tgms.temporal.guardrails.DEFAULT_CEILINGS.

