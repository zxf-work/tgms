name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # spec §7.5: make ci must finish < 15 min
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commit-hygiene check (§8.1) walks history
      # native engine (D-028): the package is a mixed Rust/Python build, so
      # a source install needs a toolchain. Cached, or this dominates CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --extra agent
      - name: rust core tests
        run: cargo test -p tgms-engine-core
      - name: rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: lint
        run: uv run ruff check tgms/ tests/ scripts/
      - name: commit hygiene (spec §8.1)
        run: uv run python scripts/check_commit_hygiene.py
      - name: site facts (docs/BLOG_STYLE.md §8)
        run: uv run python scripts/site_facts.py check
      - name: tests (fast property profile)
        run: TGMS_HYP_EXAMPLES=25 uv run pytest tests/ -q
