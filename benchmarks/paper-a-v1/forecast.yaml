# Paper A evidence campaign — machine-readable forecast (paper-a-v1)
#
# NORMATIVE for the per-row predictions. docs/design/PAPER_A_EVIDENCE_FREEZE.md
# is normative for the protocol, the mapping rules, the denominators and the
# discipline. APPEND-ONLY after commit: a changed prediction requires a dated
# addendum in the freeze, never an edit here.
#
# Reproduce the derived_admission block (machine-independent, no store needed):
#   for each plan in benchmarks/tgir-v1/plans/*.json with suite ldbc-* and
#   predicted_v1_support in {yes, partial-columns}: substitute the artifact's own
#   `params` block into itself, tgms.tgir.loader.load(), then
#   tgms.tgir.admission.plan_estimate(plan, sf1_stats) with sf1_stats below.
#   Compare each axis against tgms.temporal.guardrails.DEFAULT_CEILINGS.

freeze_id: paper-a-v1
date: '2026-08-23'
code_anchor: PENDING            # set to the commit that lands guardrail-policy-v2
#   (working tree at authoring: public HEAD e02845f46201 + the uncommitted v2
#    coefficient change in tgms/temporal/guardrails.py and tgms/tgir/admission.py)
plan_of_record: docs/design/PAPER_A_EVIDENCE_PLAN.md
freeze_of_record: docs/design/PAPER_A_EVIDENCE_FREEZE.md
discharges: [E13, E14]          # M6_BRANCH_DECISION_MEMO.md §1 inventory, §6 R3

policy:
  version: guardrail-policy-v2
  # v1 with exactly one coefficient re-calibrated on the measurement host.
  changed_coefficient:
    key: tgir_expand_unbounded
    v1_ms_per_m: 183.3      # macOS-arm64, docs/tgir/calib/expand-unbounded-2026-08-21.md
    v2_ms_per_m: 343.8      # Linux x86_64, docs/tgir/calib/expand-unbounded-2026-08-22.md
    ratio: 1.876
  ceilings:
    rows_scanned_est: 5120000000
    expansions_est: 1280000000
    time_est_ms: 10000
  unchanged_from_v1: [ceilings, axes, sum-over-nodes rule, every operator coefficient]
  not_rescored: [TGIR-v1-M3, M4-freshness]   # both measured under v1; they stand as v1 facts

substrate:
