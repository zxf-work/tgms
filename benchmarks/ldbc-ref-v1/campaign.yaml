# --------------------------------------------------------------------------
# PRE-REGISTERED predictions, scored as-written. A miss is reported, never
# retuned. Per-template predictions are derived from d1_local_rows above
# (basis cited per row); the four templates with no SF1 record
# (BI6/IS1/IS4/IS5) are explicitly labelled "no prior record" and given a
# qualitative rather than a numeric bar.
# --------------------------------------------------------------------------
predictions:
  per_template:
    basis: >-
      benchmarks/results-v1/ldbc-sf1-campaign.json (D1-local SF1 campaign,
      21/24 executed, 0 compared against any reference — this run closes
      the comparison gap, not the execution gap). For each template with a
      d1_local_rows value above, predicted attempted=compared=agreeing=that
      value (i.e. full agreement, no MAPPING-RULE/TGIR-SEMANTIC-GAP/
      ENGINE-DEFECT disagreement) UNLESS the template carries a `risk` note
      above, in which case agreement is predicted but named as the least
      confident bet in the set. BI6/IS1/IS4/IS5 (no d1_local_rows): BI6
      predicted to agree wherever v2 returns rows (D2's corrected triage);
      IS1/IS4/IS5 predicted trivially agreeing (CURRENT_ECQR_FRAGMENT,
      SINGLE_ROW, one entity_history call each per classification.json).
    predicted: >-
      24/24 templates attempted; 18/24 (every template with no `risk` note
      above, plus BI6/IS1/IS4/IS5) predicted to agree on every compared row;
      6/24 (BI3, BI10, BI17, IC5, IC12 — the design memo §7 var-length/path
      residual list — plus no sixth beyond those five, so read as 5/24) are
      the templates where a TGIR-SEMANTIC-GAP or ORDERING/TIE finding on
      some rows would not be a surprise
    pass_if: "every one of the 19 non-risk-flagged templates (all 24 minus
      BI3/BI10/BI17/IC5/IC12) shows zero disagreeing rows"
    refuted_if: "any non-risk-flagged template shows a disagreeing row with
      cause other than ORDERING/TIE or REFERENCE-SIDE-QUIRK"
  overall_agreement:
    basis: >-
      sum of d1_local_rows across the 20 templates that have one = 733 rows
      (607 BI + 66 IC + 60 IS, arithmetic over the table above); BI6.v2 and
      IS1/IS4/IS5 add an unknown but small number of further rows (single-
      row templates plus one unconstrained BI6.v2 count)
    predicted: ">= 0.95 of all compared rows agree, across all 24 templates,
      pooling every row from every template (not per-template weighted)"
    pass_if: ">= 0.90 of all compared rows agree"
    refuted_if: "< 0.75 of all compared rows agree, OR any single template
      disagrees on > 10% of its own compared rows without a documented
      cause from the closed set (MAPPING-RULE/ORDERING-TIE/
      TGIR-SEMANTIC-GAP/ENGINE-DEFECT/REFERENCE-SIDE-QUIRK)"
  bi6_is_not_a_semantic_gap:
    basis: docs/design/BI6_TRIAGE_2026-09-14.md — verdict "plan defect, not
      a TGIR semantic gap"; BI6.v2.json's structural test asserts no join
      key is nullable in its own input's schema
    predicted: "BI6.v2 agrees with the Neo4j reference wherever both sides
      return rows (i.e. is never classified TGIR-SEMANTIC-GAP)"
    pass_if: "BI6.v2's verdict has zero TGIR-SEMANTIC-GAP-caused disagreements"
    refuted_if: "any BI6.v2 disagreement is classified TGIR-SEMANTIC-GAP —
      this would mean D2's triage was itself wrong, not just BI6.json"

falsifiers:
  a: a Neo4j reference result exists for a template whose TGIR plan cannot
     express the query at all (as opposed to a same-row disagreement) —
     this would mean one of the 24 was never actually expressible
  b: a row classified MAPPING-RULE or REFERENCE-SIDE-QUIRK (i.e. "explained
     away") that, on inspection, is actually a wrong TGIR answer — a
     documented divergence rule hiding a defect rather than describing one
  c: the same-data gate (G-R3) fails — the two CSV serializations are not
     the same generated dataset, invalidating every comparison in the run
  d: BI10 (or any template) times out at the 600s ceiling on the reference
     side on every attempt, making zero comparison possible for that
     template — reported as NOT-ATTEMPTED, not folded into the agreement
     denominator
  e: more than 2 of the 5 risk-flagged templates (BI3, BI10, BI17, IC5,
     IC12) show a TGIR-SEMANTIC-GAP disagreement — this would mean the
     var-length/path-feature residual the design memo named as a risk (§7)
     is systematic rather than isolated

# No addenda yet — this is the initial freeze. Any change to `templates`,
# `neo4j`, `gates`, `predictions` or `falsifiers` above lands as a dated
# `addendum_N` block below, never as an edit to the blocks above.

# ==========================================================================
addendum_1:
  date: 2026-09-17
  by: xzgpu execution lane (ldbc-ref-v1 run of record)
  what: >-
    Scoring of the frozen predictions above against the executed run. Appended,
    never edited into the blocks above. The full account is README.md next to
    this file; the run's own records are compare-2026-09-17.json,
    timings-2026-09-17.json and manifest-2026-09-17.json.
  run:
    host: xzgpu
    commit: 0b7198dfdf7a-dirty   # five uncommitted harness fixes, README §6
    neo4j: 5.26.0 + apoc-5.26.0-core, Temurin 21.0.12+8, driver 5.28.6
    import_wall_s: 42
    index_wall_s: 14
    tgms_wall_s: 8187.2
    store: stores/snb-sf1

  gates:
    G-R1_every_attempted_has_a_result_or_refusal: PASS   # 24/24; BI6.v2's ceiling hit is a recorded TIMEOUT, not a skip
    G-R2_record_validates: PASS                          # check_result_manifest.py: conforms
    G-R3_same_data: PASS                                 # 2,997,352 nodes / 17,196,776 edges, both serializations, id digests equal

  # ------------------------------------------------------------------
  # The scoring bar below is `predictions:`' own, applied as written. It is
  # applied to a REDUCED denominator, because 8 of the 24 templates produced
  # no valid comparison for reasons that are properties of the harness and of
  # a frozen host, not of TGIR:
  #   - 7 (BI4 BI9 BI11 BI12 IC2 IC5 IC9) have an INVALID REFERENCE SIDE: their
  #     temporal parameters reached Neo4j as ISO-8601 strings, and
  #     `DATETIME > STRING` yields null rather than raising, so the reference
  #     returned 0 or 1 rows silently. Fix written and tested
  #     (ldbc_reference_run.driverize_params) but NOT executed: host compute
  #     was frozen for a 6-hour soak before the reference could be re-run.
  #   - 1 (BI6, i.e. BI6.v2) hit the 1020 s TGIR ceiling and produced no rows.
  # Scoring those 8 either way would be inventing evidence, so they are
  # reported NOT SCOREABLE rather than folded into any ratio.
  # ------------------------------------------------------------------
  scoring:
    per_template:
      verdict: REFUTED
      on: IS3
      detail: >-
        `refuted_if` reads "any non-risk-flagged template shows a disagreeing
        row with cause other than ORDERING/TIE or REFERENCE-SIDE-QUIRK". IS3 is
        non-risk-flagged and disagrees: TGIR returns 48 rows where Neo4j
        returns 24, exactly 2x, because the store encodes one KNOWS CSV row as
        two edge versions (snb_loader `both_ways=True`, M7) and
        interactive-short-3.cypher matches `-[:KNOWS]-` undirected. The cause
        is neither ORDERING/TIE nor REFERENCE-SIDE-QUIRK, so the prediction is
        refuted as written. RUNBOOK.md §4.3's own M7 line pre-classifies this
        outcome ("any KNOWS-count doubling in a result is a defect to report,
        not a normalization to apply"), and the prior P-SF1b record shows the
        same 48, so it is a standing property of the M7 encoding rather than a
        regression introduced by this run. Reported, not normalized away.
      not_scoreable: [BI4, BI9, BI11, BI12, IC2, IC5, IC9, BI6]
    overall_agreement:
      verdict: NOT SCOREABLE
      detail: >-
        The bar pools every compared row across all 24 templates; with 8
        templates uncomparable the pooled ratio would be a statement about the
        harness, not about agreement. Reported instead, over the 16 templates
        that DID produce a valid comparison: 281 of 329 compared rows agree
        (0.854), where the 48 disagreeing rows are IS3's doubling alone. That
        figure is itself conditional on a column correspondence table that this
        lane did NOT invent (see below), so it is reported as an upper-bound
        reading of the evidence and not as a score against the frozen bar.
    bi6_is_not_a_semantic_gap:
      verdict: NOT SCOREABLE (vacuous)
      detail: >-
        `pass_if` is "BI6.v2's verdict has zero TGIR-SEMANTIC-GAP-caused
        disagreements". BI6.v2 timed out at the 1020 s ceiling and produced no
        rows, so it has zero disagreements of every cause and passes
        vacuously. That is not evidence for D2's triage and is not claimed as
        such. BI6.json (the v1 artifact) did ERROR at SF1, exactly as RUNBOOK
        §6 said it should, so the v1 defect is confirmed to still reproduce.

  falsifiers:
    a_inexpressible_template: NOT TRIGGERED
    b_explained_away_row_hiding_a_defect:
      status: AT RISK — flagged deliberately
      detail: >-
        This run explains several disagreements as harness artifacts (string
        temporal parameters; a `ts` column kind that never fired; divergent
        column names). Each is evidenced rather than asserted — the IS1 rows
        are the same person differing only by exactly 1000x, the BI3/BI7/BI10/
        IS2 rows are byte-identical to the reference under positional column
        pairing — but the coordinator should audit them before any of this is
        cited, since "explained away" is precisely what falsifier b warns of.
    c_same_data_gate_fails: NOT TRIGGERED   # G-R3 PASS
    d_reference_side_timeout:
      status: ANALOGUE TRIGGERED, other side
      detail: >-
        No reference-side timeout occurred anywhere; BI10, the template named
        as most likely to approach the 600 s ceiling, ran in 0.29 s, and the
        whole Neo4j timed range is 0.007-1.974 s. The timeout fell on the TGIR
        side instead (BI6.v2, 1020 s), and is reported NOT-ATTEMPTED for
        comparison purposes rather than folded into the agreement denominator,
        which is the treatment falsifier d prescribes.
    e_systematic_path_residual:
      verdict: NOT TRIGGERED
      detail: >-
        0 of the 5 risk-flagged templates (BI3 BI10 BI17 IC5 IC12) show a
        TGIR-SEMANTIC-GAP disagreement. BI3 and BI10 return values identical to
        the reference; BI17 returns 0 rows on both sides; IC5's reference is
        invalid (0 rows both sides regardless); IC12 agrees on all 5 rows of
        the 4 columns it projects. The design memo §7 var-length/path residual
        did NOT materialise as a systematic effect at SF1.

  caveats_for_the_reader:
    - >-
      `ldbc_compare.py` matches columns BY NAME on both sides despite its own
      docstring ("by column kind, never by column name"), and 10 templates'
      two sides use different names (BI3's `forumId` vs `forum.id`, BI7's
      `relatedTagCount` vs `count`, ...). Four of them (BI3 BI7 BI10 IS2) are
      byte-identical to the reference once columns are paired positionally and
      the µs/ms rule is applied, but positional pairing is NOT universally
      safe — IC8 carries the same names in a different order, where name-based
      matching is right and positional matching would be wrong. A column
      correspondence table is a design decision and was deliberately left to
      the coordinator rather than improvised mid-run.
    - >-
      The comparator only compares the columns the TGIR schema declares, so a
      reference column the TGIR plan does not project is invisible to it.
      IC12's `tagNames` and three of BI4's five columns fall in this hole, and
      IC12's `agreeing` verdict is over-generous as a result.
    - >-
      Wall times on the two sides are NOT a speed ratio: Neo4j ran 1 warm-up +
      3 timed executions against a warm server, TGIR ran its own warmups-1/
      reps-3 protocol (1 rep when bypassed) and its `ms` excludes a 150-270 s
      per-plan store open. They are reported per side and never divided.
