  conditionality: node-only vs edge-writing corrections reported separately (from correction_class/correction_placement); the population mix is the frozen v1 one, unchanged for this addendum
  status: pre-registered, not yet submitted (211499/211555 and the D-160 lane's 211581 hold the concurrency slots; coordinator gates submission)
